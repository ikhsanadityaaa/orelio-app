name: Build unsigned iPhone IPA (free sideload)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-iphone-ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout orelio source
        uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build and package unsigned iPhone IPA
        run: |
          chmod +x tools/build_unsigned_ipa_on_mac.sh
          ./tools/build_unsigned_ipa_on_mac.sh
      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orelio-unsigned-iphone-ipa
          path: dist/orelio-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload Xcode build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orelio-device-build-log
          path: .build-iphone-unsigned/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
